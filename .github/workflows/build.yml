name: Build ASTER unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ASTER unsigned IPA
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 15.2
        shell: bash
        run: |
          set -euo pipefail

          XCODE_PATH="/Applications/Xcode_15.2.app/Contents/Developer"

          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "Xcode 15.2 was not found at:"
            echo "$XCODE_PATH"
            echo
            echo "Installed Xcode versions:"
            find /Applications -maxdepth 1 -type d -iname "Xcode*.app" -print || true
            exit 1
          fi

          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version

      - name: Prepare ASTER project structure
        shell: bash
        run: |
          set -euo pipefail

          required_root_files=(
            "project.pbxproj"
            "App.swift"
            "ContentView.swift"
            "ThreeOneOSFive-Bridging-Header.h"

            "AntiDetection.m"
            "AppIconHelper.h"
            "AppIconHelper.m"
            "bad_query.c"
            "bad_query.h"
            "DisplayIdentity.h"
            "DisplayIdentity.m"
            "DisplayIdentityAttribution.swift"
            "kexploit_opa334.h"
            "kexploit_opa334.m"
            "krw.h"
            "krw.m"
            "kutils.h"
            "kutils.m"
            "machine_info.h"
            "mcm_bridge.h"
            "mcm_bridge.m"
            "offsets.h"
            "offsets.m"
            "sandbox_escape.h"
            "sandbox_escape.m"
            "vnode.h"
            "vnode.m"
            "wallpaper_zip.c"
            "wallpaper_zip.h"
            "xpaci.h"

            "AppTabNavigationState.swift"
            "CleanerCatalog.swift"
            "ContainerBrowserLogic.swift"
            "ContainerIdentityResolver.swift"
            "ContainerStore.swift"
            "DevicePatchService.swift"
            "FileManagerService.swift"
            "FileOperationCoordinator.swift"
            "FileReplacementService.swift"
            "KernelExploit.swift"
            "LimitedCleanerService.swift"
            "Localization.swift"
            "MG.swift"
            "PatchDraftCoordinator.swift"
            "PatchDraftService.swift"
            "PatchKeyStore.swift"
            "PatchPackageCodec.swift"
            "PatchProjectLibrary.swift"
            "PatchProjectModels.swift"
            "PatchProjectStore.swift"
            "PatchTransaction.swift"
            "PatchWorkspaceService.swift"
            "SBX.swift"
            "SecureZIPArchive.swift"
            "SupportPolicy.swift"
            "Utils.swift"
            "WallpaperInstaller.swift"
            "WallpaperLabModels.swift"
            "WallpaperLabService.swift"
            "ZIPArchiveExtractor.swift"
            "ZIPArchiveWriter.swift"
          )

          optional_view_files=(
            "AppDataBrowserView.swift"
            "CleanerView.swift"
            "DesignSystem.swift"
            "FileBrowserView.swift"
            "FilesTabControls.swift"
            "FilesTabSwitcherView.swift"
            "FolderPatchSelectionView.swift"
            "LogView.swift"
            "OnboardingView.swift"
            "PatchProjectEditorView.swift"
            "PatchProjectsView.swift"
            "SettingsView.swift"
            "WallpaperLabView.swift"
          )

          for file in "${required_root_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Required source file is missing from the repository root:"
              echo "$file"
              exit 1
            fi
          done

          mkdir -p ASTER.xcodeproj

          cp project.pbxproj ASTER.xcodeproj/project.pbxproj

          mkdir -p \
            ThreeOneOSFive \
            ThreeOneOSFive/views \
            ThreeOneOSFive/helpers \
            ThreeOneOSFive/exploit \
            ThreeOneOSFive/kexploit \
            ThreeOneOSFive/en.lproj \
            ThreeOneOSFive/vi.lproj \
            ThreeOneOSFive/zh-Hans.lproj \
            ThreeOneOSFive/km.lproj \
            ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset

          copy_required() {
            local destination="$1"
            shift

            for file in "$@"; do
              if [[ ! -f "$file" ]]; then
                echo "Required source file is missing:"
                echo "$file"
                exit 1
              fi

              cp "$file" "ThreeOneOSFive/$destination/$file"
            done
          }

          copy_optional() {
            local destination="$1"
            shift

            for file in "$@"; do
              if [[ -f "$file" ]]; then
                cp "$file" "ThreeOneOSFive/$destination/$file"
              else
                echo "Optional source file not found, skipping: $file"
              fi
            done
          }

          copy_required "" \
            "App.swift" \
            "ContentView.swift"

          copy_required "views" \
            "AppDataBrowserView.swift" \
            "CleanerView.swift" \
            "DesignSystem.swift" \
            "FileBrowserView.swift" \
            "FilesTabControls.swift" \
            "FilesTabSwitcherView.swift" \
            "FolderPatchSelectionView.swift" \
            "LogView.swift" \
            "OnboardingView.swift" \
            "PatchProjectEditorView.swift" \
            "PatchProjectsView.swift" \
            "SettingsView.swift" \
            "WallpaperLabView.swift"

          copy_required "helpers" \
            "AppTabNavigationState.swift" \
            "AppIconHelper.h" \
            "AppIconHelper.m" \
            "CleanerCatalog.swift" \
            "ContainerBrowserLogic.swift" \
            "ContainerIdentityResolver.swift" \
            "ContainerStore.swift" \
            "DevicePatchService.swift" \
            "DisplayIdentity.h" \
            "DisplayIdentity.m" \
            "DisplayIdentityAttribution.swift" \
            "FileManagerService.swift" \
            "FileOperationCoordinator.swift" \
            "FileReplacementService.swift" \
            "KernelExploit.swift" \
            "LimitedCleanerService.swift" \
            "Localization.swift" \
            "MG.swift" \
            "PatchDraftCoordinator.swift" \
            "PatchDraftService.swift" \
            "PatchKeyStore.swift" \
            "PatchPackageCodec.swift" \
            "PatchProjectLibrary.swift" \
            "PatchProjectModels.swift" \
            "PatchProjectStore.swift" \
            "PatchTransaction.swift" \
            "PatchWorkspaceService.swift" \
            "SBX.swift" \
            "SecureZIPArchive.swift" \
            "SupportPolicy.swift" \
            "Utils.swift" \
            "WallpaperInstaller.swift" \
            "WallpaperLabModels.swift" \
            "WallpaperLabService.swift" \
            "ZIPArchiveExtractor.swift" \
            "ZIPArchiveWriter.swift" \
            "AntiDetection.m"

          copy_required "exploit" \
            "bad_query.c" \
            "bad_query.h" \
            "mcm_bridge.h" \
            "mcm_bridge.m" \
            "wallpaper_zip.c" \
            "wallpaper_zip.h"

          copy_required "kexploit" \
            "kexploit_opa334.h" \
            "kexploit_opa334.m" \
            "krw.h" \
            "krw.m" \
            "kutils.h" \
            "kutils.m" \
            "machine_info.h" \
            "offsets.h" \
            "offsets.m" \
            "sandbox_escape.h" \
            "sandbox_escape.m" \
            "vnode.h" \
            "vnode.m" \
            "xpaci.h"

          cp ThreeOneOSFive-Bridging-Header.h \
            ThreeOneOSFive/ThreeOneOSFive-Bridging-Header.h

          cat > ThreeOneOSFive/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>ASTER</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$(MARKETING_VERSION)</string>
            <key>CFBundleVersion</key>
            <string>$(CURRENT_PROJECT_VERSION)</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIApplicationSupportsIndirectInputEvents</key>
            <true/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict>
          </plist>
          PLIST

          printf '/* English localization placeholder */\n' \
            > ThreeOneOSFive/en.lproj/Localizable.strings

          printf '/* Vietnamese localization placeholder */\n' \
            > ThreeOneOSFive/vi.lproj/Localizable.strings

          printf '/* Simplified Chinese localization placeholder */\n' \
            > ThreeOneOSFive/zh-Hans.lproj/Localizable.strings

          printf '/* Khmer localization placeholder */\n' \
            > ThreeOneOSFive/km.lproj/Localizable.strings

          cat > ThreeOneOSFive/Assets.xcassets/Contents.json <<'JSON'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          if [[ -f AppIcon-1024.png ]]; then
            cp AppIcon-1024.png \
              ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

            cat > ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "ios-marketing",
                "scale" : "1x",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON
          elif [[ -f app-icon.png ]]; then
            cp app-icon.png \
              ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

            cat > ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "ios-marketing",
                "scale" : "1x",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON
          else
            echo "No app icon found; creating an empty AppIcon set."
            cat > ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images" : [],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON
          fi

      - name: Validate project inputs
        shell: bash
        run: |
          set -euo pipefail

          test -f ASTER.xcodeproj/project.pbxproj
          test -f ThreeOneOSFive/Info.plist
          test -f ThreeOneOSFive/ThreeOneOSFive-Bridging-Header.h
          test -d ThreeOneOSFive/Assets.xcassets
          test -f ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/Contents.json

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            ThreeOneOSFive/Info.plist

          xcodebuild \
            -project ASTER.xcodeproj \
            -list

      - name: Build ASTER app without code signing
        shell: bash
        run: |
          set -o pipefail

          rm -rf build Payload DerivedData ASTER-unsigned.ipa
          mkdir -p build/Products/Release-iphoneos

          xcodebuild \
            -project ASTER.xcodeproj \
            -target "3105" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/DerivedData" \
            CONFIGURATION_BUILD_DIR="$PWD/build/Products/Release-iphoneos" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build \
            2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(
            find "$PWD/build/Products/Release-iphoneos" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print \
              -quit
          )"

          if [[ -z "$app_path" ]]; then
            echo "The Release build did not produce an .app bundle."
            exit 1
          fi

          rm -rf Payload ASTER-unsigned.ipa
          mkdir -p Payload

          cp -R "$app_path" Payload/
          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            ASTER-unsigned.ipa

          test -s ASTER-unsigned.ipa
          ls -lh ASTER-unsigned.ipa

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-unsigned-ipa
          path: ASTER-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: warn
          retention-days: 14




