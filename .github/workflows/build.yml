name: Build ASTER unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 15.2
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          xcodebuild -version

      - name: Prepare Project Structure & Mock Resources
        shell: bash
        run: |
          set -euo pipefail

          # 1. Wrap project.pbxproj into ASTER.xcodeproj bundle if not exists
          if [ -f project.pbxproj ] && [ ! -d ASTER.xcodeproj ]; then
            mkdir -p ASTER.xcodeproj
            cp project.pbxproj ASTER.xcodeproj/
          fi

          # 2. Create the exact directory structure expected by the project file
          mkdir -p ThreeOneOSFive/en.lproj ThreeOneOSFive/vi.lproj ThreeOneOSFive/zh-Hans.lproj ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset

          # 3. Create placeholder Localizable.strings if missing
          [ ! -f ThreeOneOSFive/en.lproj/Localizable.strings ] && echo "/* en */" > ThreeOneOSFive/en.lproj/Localizable.strings
          [ ! -f ThreeOneOSFive/vi.lproj/Localizable.strings ] && echo "/* vi */" > ThreeOneOSFive/vi.lproj/Localizable.strings
          [ ! -f ThreeOneOSFive/zh-Hans.lproj/Localizable.strings ] && echo "/* zh-Hans */" > ThreeOneOSFive/zh-Hans.lproj/Localizable.strings

          # 4. Create Contents.json for Assets.xcassets
          if [ ! -f ThreeOneOSFive/Assets.xcassets/Contents.json ]; then
            echo '{"info" : {"author" : "xcode", "version" : 1}}' > ThreeOneOSFive/Assets.xcassets/Contents.json
          fi

          # 5. Create Contents.json for AppIcon.appiconset
          if [ ! -f ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/Contents.json ]; then
            echo '{"images" : [], "info" : {"author" : "xcode", "version" : 1}}' > ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/Contents.json
          fi

          # 6. Create Info.plist strictly inside the ThreeOneOSFive directory as required by project.pbxproj
          cat << 'EOF' > ThreeOneOSFive/Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<key>CFBundleDevelopmentRegion</key>
	<string>en</string>
	<key>CFBundleExecutable</key>
	<string>$(EXECUTABLE_NAME)</string>
	<key>CFBundleIdentifier</key>
	<string>com.example.ASTER</string>
	<key>CFBundleInfoDictionaryVersion</key>
	<string>6.0</string>
	<key>CFBundleName</key>
	<string>ASTER</string>
	<key>CFBundlePackageType</key>
	<string>APPL</string>
	<key>CFBundleShortVersionString</key>
	<string>1.0</string>
	<key>CFBundleVersion</key>
	<string>1</string>
	<key>LSRequiresIPhoneOS</key>
	<true/>
	<key>UILaunchStoryboardName</key>
	<string>LaunchScreen</string>
	<key>UIRequiredDeviceCapabilities</key>
	<array>
		<string>armv7</string>
	</array>
	<key>UISupportedInterfaceOrientations</key>
	<array>
		<string>UIInterfaceOrientationPortrait</string>
		<string>UIInterfaceOrientationLandscapeLeft</string>
		<string>UIInterfaceOrientationLandscapeRight</string>
	</array>
</dict>
</plist>
EOF

      - name: Build ASTER App
        shell: bash
        run: |
          set -euo pipefail

          # Manually clean output directories
          rm -rf build Payload ASTER-unsigned.ipa
          mkdir -p build/Products/Release-iphoneos

          xcodebuild \
            -project ASTER.xcodeproj \
            -target "3105" \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Products/Release-iphoneos" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "The Release build did not produce an .app bundle."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$app_path" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ASTER-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-unsigned-ipa
          path: ASTER-unsigned.ipa
          if-no-files-found: error
          retention-days: 14




