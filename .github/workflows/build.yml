name: Build ASTER unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 15.2
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          xcodebuild -version

      - name: Prepare Project Structure & Localization
        shell: bash
        run: |
          set -euo pipefail

          # 1. Wrap project.pbxproj into ASTER.xcodeproj bundle if not exists
          if [ -f project.pbxproj ] && [ ! -d ASTER.xcodeproj ]; then
            mkdir -p ASTER.xcodeproj
            cp project.pbxproj ASTER.xcodeproj/
          fi

          # 2. Ensure expected lproj directories exist to prevent missing file errors
          mkdir -p ThreeOneOSFive/zh-Hans.lproj ThreeOneOSFive/vi.lproj
          
          # If Localizable.strings exists in root or elsewhere, copy them; otherwise create placeholder files
          if [ -f Localizable.strings ]; then
            cp Localizable.strings ThreeOneOSFive/zh-Hans.lproj/
            cp Localizable.strings ThreeOneOSFive/vi.lproj/
          else
            [ ! -f ThreeOneOSFive/zh-Hans.lproj/Localizable.strings ] && echo "/* zh-Hans */" > ThreeOneOSFive/zh-Hans.lproj/Localizable.strings
            [ ! -f ThreeOneOSFive/vi.lproj/Localizable.strings ] && echo "/* vi */" > ThreeOneOSFive/vi.lproj/Localizable.strings
          fi

      - name: Build ASTER App
        shell: bash
        run: |
          set -euo pipefail

          # Manually clean output directories to avoid xcodebuild clean conflicts
          rm -rf build Payload ASTER-unsigned.ipa
          mkdir -p build/Products/Release-iphoneos

          xcodebuild \
            -project ASTER.xcodeproj \
            -target "3105" \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Products/Release-iphoneos" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "The Release build did not produce an .app bundle."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$app_path" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ASTER-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ASTER-unsigned-ipa
          path: ASTER-unsigned.ipa
          if-no-files-found: error
          retention-days: 14


